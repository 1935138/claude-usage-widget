name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `core` carries no Tauri dependency on purpose, so it has to build and test
  # on a machine with none of Tauri's system libraries. This job is what keeps
  # that true.
  core:
    name: Core crate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p claude-usage-core --all-targets -- -D warnings
      - run: cargo test -p claude-usage-core

  app:
    name: App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The Tauri crate needs the frontend bundle in place to embed.
      - run: npm run build
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Types, bundle, and the check that the CSS fully minified.
      - run: npm run build
