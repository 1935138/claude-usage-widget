# Cutting a release from CI rather than a workstation.
#
# The release script itself is unchanged and still runs locally; this only
# gives it a machine to run on. Windows Smart App Control blocks the unsigned
# test binaries cargo builds, which stops `cargo test` dead on a developer's
# own machine, and it cannot be switched back on once switched off. A runner
# has no such policy and no signing key sitting on disk.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, without the v, e.g. 0.1.7"
        required: true
        type: string

# The script commits the version bump, pushes it, and creates the release.
permissions:
  contents: write

jobs:
  release:
    name: Cut ${{ inputs.version }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The script refuses to run anywhere but main, and wants a real
          # branch rather than the detached head a bare checkout leaves.
          ref: main
          # It pushes a commit, so the clone cannot be a shallow one.
          fetch-depth: 0
          # The credentials this leaves behind are what the script's `git push`
          # uses, so they decide who GitHub records as having pushed. See the
          # note on RELEASE_TOKEN below.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          # `cargo fmt --check` is one of the script's checks; the 32-bit
          # target is one of the two architectures it builds.
          components: rustfmt
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The bump lands as a commit, so it needs an author. It is credited to
      # whoever dispatched the workflow rather than to a bot: a bot author
      # shows up in the repository's contributor list, and nobody who reads
      # that list is looking for one.
      #
      # Naming the author is not enough on its own. GitHub also records who
      # pushed and who published the release, and both are taken from the
      # token, not from `git config`. With the automatic `github.token` those
      # two are `github-actions[bot]`, and the bot lands in the contributor
      # list by that route instead. RELEASE_TOKEN is a personal access token
      # with Contents: read and write, which keeps every one of the three the
      # same person.
      - name: Name the committer
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Cut the release
        run: npm run release -- ${{ inputs.version }} --publish
        env:
          # The key's contents, not a path: there is no file on a runner.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # What `gh release create` authenticates with, and so who the
          # release is published by.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
