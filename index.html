<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Usage</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="card" id="card">
      <header class="bar" data-tauri-drag-region>
        <span class="bar-title" data-tauri-drag-region>Claude Usage</span>
        <button id="settings" class="icon" type="button" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></button>
        <button id="refresh" class="icon" type="button" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button id="close" class="icon" type="button" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </header>
      <div id="body" class="body">
        <!-- Measured for the window height, so it must keep its natural size. -->
        <div id="content"><p class="note">Reading logs&hellip;</p></div>
      </div>
      <!-- Outside #content so a re-render never disturbs it, and so the clock
           can tick every second without touching the report. -->
      <div id="clock" class="clock" data-tauri-drag-region></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
